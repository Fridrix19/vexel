<title>{{TITLE}}</title>
<meta name="theme-color" content="#0E0D0A">
<link rel="icon" type="image/svg+xml" href="{{LOGO}}">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fira+Code:wght@400;500;600;700&display=swap">
<script>(function(){var t="dark";try{var s=localStorage.getItem("mc-theme");if(s==="light"||s==="dark")t=s;}catch(e){}var h=document.documentElement;h.setAttribute("data-mc-theme",t);h.classList.toggle("mc-dark",t!=="light");})();</script>
